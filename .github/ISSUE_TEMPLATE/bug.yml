# An issue form. The schema is fixed, and a form that does not parse is shown
# as no template at all, with no error: after a change, open "New issue" on
# the repository and look. test/cases/02-plugin.sh holds the questions.
name: Bug
description: Something card, a hook or a skill did wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem does not go here: report it privately, as [SECURITY.md](https://github.com/AshwinSathian/workdeck/blob/main/SECURITY.md) says.

        **Do not paste** a session transcript, a token or a key, or a private path. A transcript holds everything the session read, and what you paste here is public. The session log of a card is a short file you commit: it is fit to paste where your repository is public, and where it is not, read it first and cut what should stay private.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The exact command or skill, and what it printed. For a hook, what the session showed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest repository and steps that show it, if you have them. A card file and the output of `card lint` often suffice.
    validations:
      required: false
  - type: input
    id: card-version
    attributes:
      label: card version
      description: The output of `card version`. In a session, ask Claude to run it, or run the `bin/card` of the plugin.
      placeholder: card 0.1.3
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: git version
      description: The output of `git --version`.
      placeholder: git version 2.50.1
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`. Write "none" if you use card without Claude Code.
      placeholder: 2.1.291 (Claude Code)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: The operating system and its version. On Linux, also which awk, from `awk --version 2>&1 | head -1` or `awk -W version 2>&1 | head -1`.
      placeholder: macOS 15.6, or Ubuntu 24.04 with mawk 1.3.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the plugin is loaded
      options:
        - Installed from the marketplace (/plugin install workdeck@workdeck)
        - Loaded from a checkout (claude --plugin-dir)
        - No plugin, card alone (downloaded, or in CI)
    validations:
      required: true
  - type: textarea
    id: session-log
    attributes:
      label: Session log
      description: Where the bug happened in a card's session and handoff wrote a log, the file from your log directory. Leave it empty where there is none.
      render: markdown
    validations:
      required: false
