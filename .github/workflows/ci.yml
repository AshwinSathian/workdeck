name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history: the test of docs/specimen.md counts merge commits
      # up to the commit the page names, and fails in CI without them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # test/cases/70-compat.sh reads bin/card of this release and fails in
      # CI without it. A checkout of the whole history brings the tags, so
      # this only makes sure. No --depth here: it would cut the history again.
      - name: Fetch the v0.1.3 tag
        run: git fetch origin tag v0.1.3
      # One version on both systems, checked against a checksum. The script
      # holds the version.
      - name: Install shellcheck
        run: /bin/bash scripts/ci-shellcheck.sh "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Print the shellcheck version
        run: shellcheck --version
      # Not pinned, on purpose: the validate step exists to catch a change in
      # Claude Code that breaks the manifests, and a pinned version would hide it.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Shellcheck
        run: make lint
      # /bin/bash is 3.2 on macOS, so a bash 4 feature fails here.
      - name: Test
        run: make test
      - name: Lint this repository's own cards
        run: /bin/bash bin/card lint
      # Relative links and their anchors, in every markdown file. No network.
      - name: Check the links
        run: make links
      - name: Validate the plugin and marketplace manifests
        run: make validate
      # Ubuntu's default awk is mawk; other distributions ship gawk. They
      # differ from each other and from the awk on macOS.
      - name: Test with awk as mawk and as gawk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gawk mawk > /dev/null
          for a in mawk gawk; do
            mkdir -p "$RUNNER_TEMP/$a"
            ln -sf "$(command -v "$a")" "$RUNNER_TEMP/$a/awk"
            PATH="$RUNNER_TEMP/$a:$PATH" /bin/bash test/run.sh
          done
